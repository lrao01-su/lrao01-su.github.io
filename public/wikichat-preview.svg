<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">WikiChat technical system design</title>
  <desc id="desc">Architecture diagram showing Wikipedia ingestion, vector indexing, ReAct agent orchestration, retrieval, and Chainlit responses.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0d1728"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#27405d" stroke-opacity=".22" stroke-width="1"/></pattern>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17263a"/><stop offset="1" stop-color="#101c2d"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#fb923c"/></marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#22d3ee"/></marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="675" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="675" rx="26" fill="url(#grid)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="52" y="55" fill="#f8fafc" font-size="27" font-weight="750">WikiChat · System Design</text>
    <text x="52" y="82" fill="#7f95ad" font-size="14">Dynamic Wikipedia indexing + agentic retrieval with LlamaIndex</text>
    <g transform="translate(870,42)"><rect width="278" height="42" rx="10" fill="#111e30" stroke="#29415d"/><circle cx="20" cy="21" r="5" fill="#34d399"/><text x="35" y="26" fill="#a7f3d0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">CHAINLIT / OPENAI / RAG</text></g>

    <text x="52" y="124" fill="#fb923c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" letter-spacing="1.4">01 · KNOWLEDGE INGESTION</text>
    <path d="M208 190H251" stroke="#fb923c" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
    <path d="M421 190H465" stroke="#fb923c" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
    <path d="M635 190H679" stroke="#fb923c" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
    <path d="M849 190H893" stroke="#fb923c" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

    <g transform="translate(52,145)" filter="url(#shadow)"><rect width="156" height="91" rx="13" fill="url(#node)" stroke="#fb923c" stroke-opacity=".8"/><text x="18" y="27" fill="#fdba74" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">CHAINLIT SETTINGS</text><text x="18" y="54" fill="#f8fafc" font-size="15" font-weight="700">Page request</text><text x="18" y="75" fill="#8fa4bb" font-size="12">+ model selector</text></g>
    <g transform="translate(251,145)" filter="url(#shadow)"><rect width="170" height="91" rx="13" fill="url(#node)" stroke="#fb923c" stroke-opacity=".8"/><text x="17" y="27" fill="#fdba74" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5">OpenAIPydanticProgram</text><text x="17" y="54" fill="#f8fafc" font-size="15" font-weight="700">Extract page list</text><text x="17" y="75" fill="#8fa4bb" font-size="12">WikiPageList model</text></g>
    <g transform="translate(465,145)" filter="url(#shadow)"><rect width="170" height="91" rx="13" fill="url(#node)" stroke="#fb923c" stroke-opacity=".8"/><text x="17" y="27" fill="#fdba74" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">WikipediaReader</text><text x="17" y="54" fill="#f8fafc" font-size="15" font-weight="700">Load documents</text><text x="17" y="75" fill="#8fa4bb" font-size="12">requested pages</text></g>
    <g transform="translate(679,145)" filter="url(#shadow)"><rect width="170" height="91" rx="13" fill="url(#node)" stroke="#fb923c" stroke-opacity=".8"/><text x="17" y="27" fill="#fdba74" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">SentenceSplitter</text><text x="17" y="54" fill="#f8fafc" font-size="15" font-weight="700">Chunk content</text><text x="17" y="75" fill="#8fa4bb" font-size="12">150 tokens · 45 overlap</text></g>
    <g transform="translate(893,145)" filter="url(#shadow)"><rect width="255" height="91" rx="13" fill="#122a33" stroke="#2dd4bf"/><text x="18" y="27" fill="#5eead4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">VectorStoreIndex</text><text x="18" y="54" fill="#f8fafc" font-size="15" font-weight="700">In-memory knowledge index</text><text x="18" y="75" fill="#8fa4bb" font-size="12">rebuilt on settings update</text></g>

    <path d="M1020 236V305" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrowSlate)"/>
    <text x="1033" y="275" fill="#6f879f" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10">global index</text>

    <text x="52" y="301" fill="#22d3ee" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" letter-spacing="1.4">02 · QUESTION ANSWERING</text>
    <path d="M196 377H243" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
    <path d="M425 377H471" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
    <path d="M661 377H707" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
    <path d="M899 377H937" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arrowCyan)"/>

    <g transform="translate(52,326)" filter="url(#shadow)"><rect width="144" height="102" rx="13" fill="url(#node)" stroke="#22d3ee" stroke-opacity=".8"/><text x="17" y="28" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">@cl.on_message</text><text x="17" y="58" fill="#f8fafc" font-size="15" font-weight="700">User prompt</text><text x="17" y="80" fill="#8fa4bb" font-size="12">Chainlit UI</text></g>
    <g transform="translate(243,326)" filter="url(#shadow)"><rect width="182" height="102" rx="13" fill="url(#node)" stroke="#22d3ee" stroke-opacity=".8"/><text x="17" y="28" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">ReActAgent</text><text x="17" y="56" fill="#f8fafc" font-size="15" font-weight="700">Plan + call tool</text><text x="17" y="78" fill="#8fa4bb" font-size="12">GPT-3.5 or GPT-4</text></g>
    <g transform="translate(471,326)" filter="url(#shadow)"><rect width="190" height="102" rx="13" fill="url(#node)" stroke="#22d3ee" stroke-opacity=".8"/><text x="17" y="28" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">QueryEngineTool</text><text x="17" y="56" fill="#f8fafc" font-size="15" font-weight="700">WikipediaSearch</text><text x="17" y="78" fill="#8fa4bb" font-size="12">tool metadata + routing</text></g>
    <g transform="translate(707,326)" filter="url(#shadow)"><rect width="192" height="102" rx="13" fill="url(#node)" stroke="#22d3ee" stroke-opacity=".8"/><text x="17" y="28" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">QueryEngine</text><text x="17" y="56" fill="#f8fafc" font-size="15" font-weight="700">Retrieve + synthesize</text><text x="17" y="78" fill="#8fa4bb" font-size="12">compact · top_k = 10</text></g>
    <g transform="translate(937,326)" filter="url(#shadow)"><rect width="211" height="102" rx="13" fill="#102a36" stroke="#22d3ee"/><text x="17" y="28" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">@cl.Message</text><text x="17" y="56" fill="#f8fafc" font-size="15" font-weight="700">Grounded response</text><text x="17" y="78" fill="#8fa4bb" font-size="12">returned to chat</text></g>

    <path d="M1020 305C982 280 889 281 835 324" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrowSlate)"/>
    <path d="M1020 305C1072 287 1100 300 1100 324" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="5 5"/>

    <rect x="52" y="470" width="1096" height="80" rx="13" fill="#0c1726" stroke="#263d58"/>
    <text x="74" y="497" fill="#7f95ad" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="1.2">RUNTIME + OBSERVABILITY</text>
    <g transform="translate(74,512)"><rect width="214" height="25" rx="6" fill="#18283b"/><text x="13" y="17" fill="#c6d3e1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">CallbackManager</text><text x="128" y="17" fill="#64748b" font-size="11">→</text><text x="148" y="17" fill="#93c5fd" font-size="11">Debug</text></g>
    <g transform="translate(310,512)"><rect width="235" height="25" rx="6" fill="#18283b"/><text x="13" y="17" fill="#c6d3e1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">utils.get_apikey()</text><text x="150" y="17" fill="#64748b" font-size="11">→</text><text x="170" y="17" fill="#93c5fd" font-size="11">OpenAI</text></g>
    <g transform="translate(567,512)"><rect width="249" height="25" rx="6" fill="#18283b"/><text x="13" y="17" fill="#c6d3e1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">global state</text><text x="93" y="17" fill="#64748b" font-size="11">→</text><text x="113" y="17" fill="#93c5fd" font-size="11">index + agent</text></g>
    <g transform="translate(838,512)"><rect width="288" height="25" rx="6" fill="#18283b"/><text x="13" y="17" fill="#c6d3e1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">async bridge</text><text x="91" y="17" fill="#64748b" font-size="11">→</text><text x="111" y="17" fill="#93c5fd" font-size="11">cl.make_async(agent.chat)</text></g>

    <g transform="translate(52,588)"><circle cx="6" cy="6" r="5" fill="#fb923c"/><text x="19" y="11" fill="#94a3b8" font-size="12">indexing path</text><circle cx="130" cy="6" r="5" fill="#22d3ee"/><text x="143" y="11" fill="#94a3b8" font-size="12">query path</text><text x="950" y="11" fill="#57708a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">chat_agent.py · index_wikipages.py · utils.py</text></g>
  </g>
</svg>
