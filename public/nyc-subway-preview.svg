      <g fill="#315170"><rect x="816" y="530" width="24" height="44" rx="4"/><rect x="854" y="506" width="24" height="68" rx="4"/><rect x="892" y="486" width="24" height="88" rx="4"/><rect x="930" y="515" width="24" height="59" rx="4"/><rect x="968" y="470" width="24" height="104" rx="4"/><rect x="1006" y="448" width="24" height="126" rx="4"/><rect x="1044" y="428" width="24" height="146" rx="4" fill="#ff6319"/></g>
      <line x1="812" y1="574" x2="1108" y2="574" stroke="#334155"/>
