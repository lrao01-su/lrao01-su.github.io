      <path d="M190 570 C210 510 260 470 310 444 S410 395 472 352 S575 282 694 263" fill="none" stroke="#b933ad" stroke-width="12" stroke-linecap="round"/>
      <path d="M132 196 C182 236 250 246 310 242 S410 224 475 247 S580 314 706 347" fill="none" stroke="#6cbe45" stroke-width="12" stroke-linecap="round"/>
      <g fill="#f8fafc" stroke="#111827" stroke-width="5">
        <circle cx="151" cy="492" r="10"/><circle cx="260" cy="406" r="10"/><circle cx="414" cy="315" r="10"/><circle cx="575" cy="215" r="10"/><circle cx="675" cy="202" r="10"/>
        <circle cx="154" cy="263" r="10"/><circle cx="288" cy="329" r="10"/><circle cx="448" cy="418" r="10"/><circle cx="585" cy="484" r="10"/><circle cx="685" cy="505" r="10"/>
      </g>
      <g><circle cx="414" cy="315" r="18" fill="#ff6319"/><text x="407" y="321" fill="white" font-size="16" font-weight="800">F</text></g>
      <g><circle cx="448" cy="418" r="18" fill="#0039a6"/><text x="441" y="424" fill="white" font-size="16" font-weight="800">E</text></g>
