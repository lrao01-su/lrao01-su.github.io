<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">NYC Subway Analysis project preview</title>
  <desc id="desc">A transit data dashboard with subway routes, train arrival status, and ridership charts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#07121f"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#182234"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="675" rx="26" fill="url(#bg)"/>
  <g font-family="Inter,Arial,sans-serif">
